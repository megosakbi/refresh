<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Cookie Refresher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-center min-h-screen p-6">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl mt-10">
        <h1 class="text-2xl font-bold text-purple-400 mb-2">MeowTool Web - Cookie Refresher</h1>
        <p class="text-sm text-slate-400 mb-6">Paste your cookie below. It will refresh using your embedded proxy safely.</p>
        
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Target Cookie</label>
            <textarea id="cookieInput" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-purple-500" placeholder="_|WARNING:-DO-NOT-SHARE-THIS..."></textarea>
        </div>

        <button onclick="refreshCookie()" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 font-semibold py-2.5 rounded-lg transition-all text-white shadow-lg shadow-purple-900/30">
            Refresh Cookie
        </button>

        <div class="mt-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Refreshed Output</label>
            <textarea id="cookieOutput" readonly rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm text-emerald-400 focus:outline-none" placeholder="Refreshed cookie will appear here..."></textarea>
        </div>
    </div>

    <script>
        async function refreshCookie() {
            const btn = document.getElementById('submitBtn');
            const cookie = document.getElementById('cookieInput').value.trim();
            const output = document.getElementById('cookieOutput');

            if (!cookie) {
                alert('Please enter a cookie first!');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Refreshing via Proxy...';
            output.value = 'Processing request...';

            try {
                const response = await fetch('/api/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cookie })
                });
                const data = await response.json();
                output.value = data.result || data.error || 'Unknown response';
            } catch (err) {
                output.value = 'Error: ' + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Refresh Cookie';
            }
        }
    </script>
</body>
</html>
